[project]
name = "psi-lab2"
version = "1.0.0"
description = "Лабораторная работа №2: выдача экзаменационных билетов (CustomTkinter)"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "customtkinter>=5.2",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# --capture=sys: перехват вывода на уровне файловых дескрипторов мешает
# Tcl 9 в Windows читать свои файлы — UI-тесты изредка падали бы.
addopts = "--import-mode=importlib --capture=sys"
